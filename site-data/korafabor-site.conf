server {
    listen 80;
    server_name korafabor.pro www.korafabor.pro;
    access_log off;
    location /.well-known/acme-challenge/ { root /var/www/certbot; try_files $uri =404; }
    location / { return 301 https://korafabor.pro$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name www.korafabor.pro;
    ssl_certificate /etc/letsencrypt/live/korafabor.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/korafabor.pro/privkey.pem;
    return 301 https://korafabor.pro$request_uri;
}
server {
    listen 443 ssl http2;
    server_name korafabor.pro;
    ssl_certificate /etc/letsencrypt/live/korafabor.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/korafabor.pro/privkey.pem;
    root /var/www/korafabor/current;
    index index.html;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    gzip on;
    gzip_vary on;
    gzip_comp_level 2;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;
    error_page 404 /404.html;
    location = /api/matches {
        limit_except GET HEAD { deny all; }
        proxy_pass http://koratv_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host stream-api.koratv.click;
        # Compatibility is restricted to the existing public, read-only site listing.
        proxy_set_header Origin https://koratv.click;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
        proxy_next_upstream off;
        proxy_cache koratv_match_feed;
        proxy_cache_key "korafabor-public|$request_uri|$koratv_match_cache_minute";
        proxy_cache_valid 200 5s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 2s;
        proxy_cache_use_stale off;
        proxy_cache_bypass $koratv_match_query_bypass;
        proxy_no_cache $koratv_match_query_bypass $upstream_http_set_cookie;
        proxy_ignore_headers Cache-Control Expires;
        proxy_hide_header Cache-Control;
        add_header Cache-Control no-store always;
    }
    location = /api/broadcast-events {
        limit_except GET HEAD { deny all; }
        proxy_pass http://koratv_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host stream-api.koratv.click;
        proxy_set_header Origin https://koratv.click;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 75s;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control no-store always;
    }
    location /api/ { return 404; }
    location = /404.html { internal; add_header X-Robots-Tag noindex always; }
    location ~ /\.(?!well-known/) { return 404; }
    location ~* \.(?:env|sql|log|map|ya?ml|bak|backup|md|php)$ { return 404; }
    location ~* \.mjs$ { types { application/javascript mjs; } expires 1h; try_files $uri =404; }
    location ~* \.(?:css|js|mjs|png|jpg|jpeg|webp|svg|ico|woff2?)$ { expires 1h; try_files $uri =404; }
    location / { add_header Cache-Control "public, max-age=0, must-revalidate" always; try_files $uri $uri/ =404; }
}
