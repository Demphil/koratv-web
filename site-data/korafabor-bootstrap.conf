server {
    listen 80;
    server_name korafabor.pro www.korafabor.pro;
    access_log off;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
    location / {
        add_header X-Robots-Tag noindex always;
        add_header Retry-After 600 always;
        return 503;
    }
}
