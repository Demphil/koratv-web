location = /site-metadata/matches.json {
    alias /var/lib/koratv-site-publish/matches.json;
    default_type application/json;
    add_header Cache-Control "public, max-age=30, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Access-Control-Allow-Origin $kora_public_metadata_origin always;
    add_header Vary Origin always;
    gzip on;
    gzip_types application/json;
    gzip_comp_level 2;
    gzip_min_length 1024;
    limit_except GET HEAD { deny all; }
}
