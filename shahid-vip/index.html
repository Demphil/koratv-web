<html lang="ar" dir="rtl">
<head>

    <style>
        body {
            background: linear-gradient(to right, #4b2c64, #f83a7f);
            margin: 0;
            padding: 0;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        .page-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px; /* تم تقليل المسافة قليلاً لتناسب التنبيه */
            width: 100%;
            max-width: 1000px;
            padding: 20px; /* إضافة حواف داخلية للشاشات الصغيرة */
            box-sizing: border-box;
        }
        h2 {
            font-size: 2.2em;
            margin: 0;
            margin-top: 10px;
        }
        
        /* تصميم صندوق التنبيه */
        .alert-box {
            background-color: rgba(255, 255, 255, 0.15); /* خلفية شفافة */
            border: 2px solid #ffd700; /* إطار ذهبي بارز */
            color: #ffd700; /* نص ذهبي */
            padding: 12px 20px;
            border-radius: 8px;
            width: 100%;
            font-size: 1.1em;
            font-weight: bold;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .alert-icon {
            margin-left: 8px;
            font-size: 1.2em;
        }

        /* تصميم أزرار السيرفرات */
        .servers-menu {
            display: flex;
            gap: 15px;
            margin-bottom: 5px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .servers-menu button {
            background-color: #ffffff;
            color: #4b2c64;
            border: 2px solid #ffffff;
            padding: 10px 25px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .servers-menu button:hover, .servers-menu button.active {
            background-color: #4b2c64;
            color: #ffffff;
        }
        /* حاوية الفيديو */
        .iframe-container {
            width: 100%;
            height: 600px;
            position: relative;
            background-color: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* جعل التصميم متجاوباً مع الهواتف */
        @media (max-width: 768px) {
            .iframe-container {
                height: 250px; /* تصغير المشغل في الهواتف */
            }
            .alert-box {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>

    <div class="page-container">
        <h2>اختر سيرفر المشاهدة</h2>
        
        <!-- رسالة التنبيه للزوار -->
        <div class="alert-box">
            <span class="alert-icon">⚠️</span> تنبيه: في حال توقف البث أو واجهت تقطيعاً في السيرفر الأول، يرجى تجربة السيرفرات الأخرى من الأزرار أدناه.
        </div>
        
        <!-- أزرار اختيار السيرفر -->
        <div class="servers-menu">
            <button onclick="changeServer(this, 'https://withered-mud-4e52.koora-live.workers.dev/?url=https://li.yalla-cou.xyz/albaplayer/mbc-action/?serv=2')" class="active">سيرفر 1</button>
            <button onclick="changeServer(this, 'https://withered-mud-4e52.koora-live.workers.dev/?url=https://pl.koralive1.cc/albaplayer/mbc-action/?serv=0')">سيرفر 2</button>
            <button onclick="changeServer(this, 'https://withered-mud-4e52.koora-live.workers.dev/?url=https://syria-live.info/albaplayer/bnn2/?serv=0')">سيرفر 3</button>
        </div>

        <!-- المشغل الذي ستتغير بداخله القنوات -->
        <div class="iframe-container">
            <iframe id="main-player" 
                src="https://withered-mud-4e52.koora-live.workers.dev/?url=https://li.yalla-cou.xyz/albaplayer/mbc-action/?serv=2" 
                allowfullscreen="true">
            </iframe>
        </div>
    </div>

    <!-- سكريبت لتغيير البث عند الضغط على الزر -->
    <script>
        function changeServer(btn, url) {
            document.getElementById('main-player').src = url;
            
            var buttons = document.querySelectorAll('.servers-menu button');
            buttons.forEach(function(button) {
                button.classList.remove('active');
            });
            
            btn.classList.add('active');
        }
    </script>



</body>
</html>
