name: Submit IndexNow URLs

on:
  # Automatic submission belongs to the successful publication workflow.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit-indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci --ignore-scripts --omit=dev --no-audit --fund=false

      - name: Submit sitemap URLs to IndexNow
        run: npm run indexnow
        continue-on-error: true
