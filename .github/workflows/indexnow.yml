name: Submit IndexNow URLs

on:
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - "sitemap.xml"
      - "robots.txt"
      - "7fbee603f5d44620b6cf6cdff1cb2156.txt"
      - "scripts/submit-indexnow.js"
  workflow_dispatch:

jobs:
  submit-indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --omit=dev

      - name: Wait for static hosting refresh
        run: sleep 90

      - name: Submit sitemap URLs to IndexNow
        run: npm run indexnow
        continue-on-error: true
