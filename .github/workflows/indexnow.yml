name: Submit IndexNow URLs

on:
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - "sitemap.xml"
      - "robots.txt"
      - "8f13b7e3fc9c709be30188a8675772ed.txt"
      - "scripts/submit-indexnow.js"
  workflow_dispatch:

jobs:
  submit-indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci --omit=dev --no-audit --fund=false

      - name: Wait for static hosting refresh
        run: sleep 90

      - name: Submit sitemap URLs to IndexNow
        run: npm run indexnow
        continue-on-error: true
