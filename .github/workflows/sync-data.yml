name: Unified Data Refresh

on:
  schedule:
    - cron: "1 0 * * *"
    - cron: "17 */4 * * *"
  workflow_dispatch:

concurrency:
  group: shared-match-metadata
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  metadata:
    name: Prune expired snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_MATCHES_TABLE: matches
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: secure-streaming/package-lock.json
      - run: npm ci
        working-directory: secure-streaming
      - name: Remove expired match snapshots
        working-directory: secure-streaming
        run: npm run prune:matches
      # Oracle owns Kooora ingestion and supplier refresh. No runtime restart here.

  deploy-pages:
    name: Publish current match snapshot
    needs: metadata
    concurrency:
      group: static-pages-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_MATCHES_TABLE: matches
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and validate static pages
        run: |
          npm ci --ignore-scripts --no-audit --fund=false
          node scripts/check-seo.js
          node --test scripts/build-public-site.test.cjs scripts/generate-match-pages.test.cjs scripts/prerender-match-list.test.cjs scripts/match-archive.test.cjs
          node --test scripts/build-complete-site.test.cjs scripts/news-pages.test.cjs
          node scripts/build-complete-site.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Notify IndexNow
        run: node scripts/submit-indexnow.js
        env:
          INDEXNOW_SITEMAP_PATH: _site/sitemap.xml
        continue-on-error: true
