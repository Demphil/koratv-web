name: Unified Data Refresh

on:
  schedule:
    - cron: "1 0 * * *"
    - cron: "17 */4 * * *"
  workflow_dispatch:

concurrency:
  group: unified-data-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  metadata:
    name: Prune stale data and refresh matches
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      SUPABASE_MATCHES_TABLE: matches
      MATCH_SOURCE_PROVIDER: both
      GEMINI_ENRICH_AFTER_MATCH_SYNC: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: secure-streaming/package-lock.json
      - name: Install dependencies
        working-directory: secure-streaming
        run: npm ci
      - name: Remove expired match snapshots
        working-directory: secure-streaming
        run: npm run prune:matches
      - name: Refresh matches and broadcaster names
        working-directory: secure-streaming
        run: npm run sync:matches:daily

  catalog:
    name: Refresh Oracle provider catalog
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Oracle gateway bundle
        run: |
          set -euo pipefail
          rm -rf _oracle-sync
          mkdir -p _oracle-sync
          curl --fail --silent --show-error --retry 2 --max-time 15 \
            https://raw.githubusercontent.com/Demphil/foottv6/main/manual-match-selection.json \
            -o /tmp/fraja-manual-selection.json
          node scripts/merge-manual-matches.cjs manual-match-selection.json \
            /tmp/fraja-manual-selection.json _oracle-sync/manual-match-selection.json
          cp manual-broadcast-overrides.json _oracle-sync/manual-broadcast-overrides.json
          rsync -a streaming-gateway/ _oracle-sync/streaming-gateway/ \
            --exclude node_modules \
            --exclude dist \
            --exclude .env \
            --exclude "*.log" \
            --exclude "scripts/audit-provider-accounts.js"
          rsync -a shared/ _oracle-sync/shared/
          mkdir -p _oracle-sync/metadata
          cp secure-streaming/scripts/sync-matches-from-source.js _oracle-sync/metadata/
          cp secure-streaming/scripts/api-football-client.mjs _oracle-sync/metadata/
          cp secure-streaming/scripts/prune-match-data.js _oracle-sync/metadata/
          cp secure-streaming/src/lib/loadEnv.js secure-streaming/src/lib/supabaseAdmin.js _oracle-sync/metadata/
          cp ecosystem.oracle.config.js _oracle-sync/ecosystem.oracle.config.js
      - name: Prepare private console password hash
        env:
          PASSWORD_HASH: ${{ secrets.BROADCAST_ADMIN_PASSWORD_HASH }}
        run: |
          test -n "$PASSWORD_HASH"
          printf '%s' "$PASSWORD_HASH" > _oracle-sync/operator-password-hash
          chmod 0600 _oracle-sync/operator-password-hash
      - name: Check Oracle SSH configuration
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST" && test -n "$ORACLE_USER" && test -n "$ORACLE_SSH_KEY"
      - name: Upload current gateway code to Oracle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          source: "_oracle-sync"
          target: "/tmp/koratv-oracle-sync-${{ github.run_id }}"
      - name: Refresh current links on Oracle
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            STAGING="/tmp/koratv-oracle-sync-${{ github.run_id }}/_oracle-sync"
            RELEASE="/opt/koratv/current"
            test -d "$STAGING/streaming-gateway"
            test -d "$RELEASE/streaming-gateway"

            install -d -m 0700 /opt/koratv/backups
            tar -czf "/opt/koratv/backups/gateway-${{ github.run_id }}.tgz" \
              --exclude=node_modules --exclude=.env --exclude=dist --exclude="*.log" \
              -C "$RELEASE" streaming-gateway shared ecosystem.oracle.config.js

            rsync -a --delete "$STAGING/streaming-gateway/" "$RELEASE/streaming-gateway/" \
              --exclude .env \
              --exclude node_modules \
              --exclude dist \
              --exclude "*.log"
            rsync -a --delete "$STAGING/shared/" "$RELEASE/shared/"
            # Keep the running metadata worker on the same public match schema.
            LEGACY="/home/ubuntu/iptv-system/secure-streaming"
            if test -f "$LEGACY/scripts/sync-matches-from-source.js"; then
              BACKUP_PATHS=(secure-streaming/scripts/sync-matches-from-source.js)
              for FILE in secure-streaming/scripts/prune-match-data.js secure-streaming/scripts/api-football-client.mjs secure-streaming/src/lib/loadEnv.js secure-streaming/src/lib/supabaseAdmin.js shared; do
                if test -e "/home/ubuntu/iptv-system/$FILE"; then BACKUP_PATHS+=("$FILE"); fi
              done
              tar -czf "/opt/koratv/backups/metadata-${{ github.run_id }}.tgz" \
                -C /home/ubuntu/iptv-system "${BACKUP_PATHS[@]}"
              install -d -m 0755 "$LEGACY/src/lib" /home/ubuntu/iptv-system/shared
              for FILE in sync-matches-from-source.js prune-match-data.js api-football-client.mjs; do
                install -m 0644 "$STAGING/metadata/$FILE" "$LEGACY/scripts/$FILE"
              done
              for FILE in loadEnv.js supabaseAdmin.js; do
                install -m 0644 "$STAGING/metadata/$FILE" "$LEGACY/src/lib/$FILE"
              done
              cp "$STAGING/shared/"*.mjs /home/ubuntu/iptv-system/shared/
              node --check "$LEGACY/scripts/sync-matches-from-source.js"
              if ! (cd "$LEGACY" && node --input-type=module -e 'await import("./scripts/sync-matches-from-source.js"); console.log("metadata schema import ready")'); then
                tar -xzf "/opt/koratv/backups/metadata-${{ github.run_id }}.tgz" -C /home/ubuntu/iptv-system
                echo "Metadata import failed; previous code restored"
                exit 1
              fi
              node -e '
                const {execFileSync}=require("node:child_process");
                const apps=JSON.parse(execFileSync("pm2",["jlist"],{encoding:"utf8"}));
                for(const app of apps){
                  const env=app.pm2_env||{};
                  if(env.pm_exec_path==="/home/ubuntu/iptv-system/secure-streaming/scripts/match-sync-cron.js"
                    || (app.name==="match-sync-cron" && env.pm_cwd==="/home/ubuntu/iptv-system/secure-streaming"))
                    execFileSync("pm2",["restart",String(app.pm_id)],{stdio:"inherit"});
                }
              '
            fi
            install -m 0644 "$STAGING/ecosystem.oracle.config.js" "$RELEASE/ecosystem.oracle.config.js"

            cd /opt/koratv/current/streaming-gateway
            node --input-type=module - "$STAGING/operator-password-hash" <<'NODE'
            import {readFileSync, writeFileSync} from 'node:fs';
            const hash=readFileSync(process.argv[2],'utf8').trim();
            if(!/^scrypt:[a-f0-9]{32}:[a-f0-9]{64}$/.test(hash)) throw new Error('Invalid operator password hash');
            const path='/etc/koratv/gateway.env';
            const lines=readFileSync(path,'utf8').split(/\r?\n/).filter(line=>!line.startsWith('BROADCAST_ADMIN_PASSWORD_HASH='));
            lines.push('BROADCAST_ADMIN_PASSWORD_HASH='+hash);
            writeFileSync(path,lines.join('\n'),{mode:0o600});
            NODE
            rm -f .env
            ln -s /etc/koratv/gateway.env .env
            npm ci --omit=dev --no-audit --fund=false
            node --env-file=.env scripts/install-broadcast-overrides.mjs "$STAGING/manual-broadcast-overrides.json"
            flock -w 300 /etc/koratv/provider-catalog.lock node --env-file=.env scripts/sync-provider-pool.js
            node --env-file=.env scripts/verify-channel-mappings.mjs
            flock -w 300 /etc/koratv/direct-match-route-state.lock node --env-file=.env scripts/maintenance-sync.js
            flock -w 300 /etc/koratv/match-resource-assignment.lock bash -c '
              set -e
              node --env-file=.env scripts/install-manual-selection.mjs "$1"
              node --env-file=.env scripts/resource-assignment.js
            ' bash "$STAGING/manual-match-selection.json"
            cd /opt/koratv/current
            pm2 delete iptv-app || true
            # PM2 reload keeps the old cwd/script; recreate only this managed scheduler.
            pm2 delete koratv-provider-pool-sync || true
            pm2 startOrReload ecosystem.oracle.config.js --env production --update-env
            pm2 save
            healthy=false
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --silent --show-error http://127.0.0.1:3100/healthz >/dev/null; then
                healthy=true
                break
              fi
              sleep 2
            done
            if [ "$healthy" != true ]; then
              pm2 describe koratv-oracle-watch || true
              pm2 logs koratv-oracle-watch --lines 120 --nostream || true
              exit 1
            fi
            rm -rf "/tmp/koratv-oracle-sync-${{ github.run_id }}"

  deploy-pages:
    name: Redeploy GitHub Pages frontend
    needs: catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_MATCHES_TABLE: matches
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare static frontend artifact
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --fund=false
          node --test scripts/build-public-site.test.cjs
          node scripts/build-public-site.cjs
      - name: Test and generate indexable match pages
        run: |
          node --test scripts/generate-match-pages.test.cjs
          node scripts/generate-match-pages.cjs --output _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Notify IndexNow about published URLs
        run: node scripts/submit-indexnow.js
        env:
          INDEXNOW_SITEMAP_PATH: _site/sitemap.xml
        continue-on-error: true

  deploy-player:
    name: Redeploy fabor player
    needs: catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: streaming-gateway/package-lock.json
      - name: Build isolated player
        working-directory: streaming-gateway
        run: |
          set -euo pipefail
          npm ci --omit=dev --no-audit --fund=false
          npm run build:player
      - name: Upload player artifact to Njalla
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "streaming-gateway/dist,streaming-gateway/nginx.conf.example,streaming-gateway/nginx.http-player.conf.example"
          target: "/tmp/koratv-player-sync-${{ github.run_id }}"
      - name: Publish player files on Njalla
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            PLAYER_DOMAIN="fabor.sbs"
            ROOT="/tmp/koratv-player-sync-${{ github.run_id }}/streaming-gateway"
            SRC="$ROOT/dist"
            test -d "$SRC"
            test -f "$ROOT/nginx.conf.example"
            test -f "$ROOT/nginx.http-player.conf.example"
            install -d -m 0755 /var/www/koratv-player
            install -d -m 0700 /var/backups/koratv
            tar -czf "/var/backups/koratv/player-${{ github.run_id }}.tgz" -C /var/www/koratv-player .
            cp -a /etc/nginx/sites-available/koratv "/var/backups/koratv/nginx-${{ github.run_id }}.conf"
            find /var/www/koratv-player -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
            cp -a "$SRC/." /var/www/koratv-player/
            find /var/www/koratv-player -type d -exec chmod 0755 {} +
            find /var/www/koratv-player -type f -exec chmod 0644 {} +
            if [ -f "/etc/letsencrypt/live/$PLAYER_DOMAIN/fullchain.pem" ]; then
              install -m 0644 "$ROOT/nginx.conf.example" /etc/nginx/sites-available/koratv
            else
              install -m 0644 "$ROOT/nginx.http-player.conf.example" /etc/nginx/sites-available/koratv
            fi
            ln -sfn /etc/nginx/sites-available/koratv /etc/nginx/sites-enabled/koratv
            nginx -t
            systemctl reload nginx
            rm -rf "/tmp/koratv-player-sync-${{ github.run_id }}"
