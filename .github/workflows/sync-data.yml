name: Unified Data Refresh

on:
  schedule:
    - cron: "59 22 * * *"
  workflow_dispatch:

concurrency:
  group: unified-data-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  metadata:
    name: Prune stale data and refresh matches
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_MATCHES_TABLE: matches
      MATCH_SOURCE_PROVIDER: kooora
      GEMINI_ENRICH_AFTER_MATCH_SYNC: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: secure-streaming/package-lock.json
      - name: Install dependencies
        working-directory: secure-streaming
        run: npm ci
      - name: Remove expired match snapshots
        working-directory: secure-streaming
        run: npm run prune:matches
      - name: Refresh matches and broadcaster names
        working-directory: secure-streaming
        run: npm run sync:matches:daily

  catalog:
    name: Refresh Oracle provider catalog
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check Oracle SSH configuration
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST" && test -n "$ORACLE_USER" && test -n "$ORACLE_SSH_KEY"
      - name: Refresh current links on Oracle
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd /opt/koratv/current/streaming-gateway
            flock -w 300 /etc/koratv/provider-catalog.lock node --env-file=.env scripts/sync-provider-pool.js

  deploy-pages:
    name: Redeploy GitHub Pages frontend
    needs: catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_MATCHES_TABLE: matches
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare static frontend artifact
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude .git \
            --exclude .github \
            --exclude _site \
            --exclude node_modules \
            --exclude secure-streaming/node_modules \
            --exclude streaming-gateway/node_modules \
            --exclude secure-streaming/.next \
            --exclude streaming-gateway/dist \
            --exclude "**/.env*" \
            --exclude "**/*.log"
      - name: Test and generate indexable match pages
        run: |
          node --test scripts/generate-match-pages.test.cjs
          node scripts/generate-match-pages.cjs --output _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Notify IndexNow about published URLs
        run: node scripts/submit-indexnow.js
        env:
          INDEXNOW_SITEMAP_PATH: _site/sitemap.xml
        continue-on-error: true
