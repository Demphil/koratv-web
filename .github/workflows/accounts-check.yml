name: Inspect IPTV account pool
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: account-pool-diagnostics
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          command_timeout: 4m
          script: |
            set -eu
            cd /opt/koratv/current/streaming-gateway
            node --env-file=.env scripts/accounts-status.js
