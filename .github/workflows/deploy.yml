name: Deploy streaming gateway

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: streaming-gateway-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Njalla VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Pull, test, build, and restart gateway only
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 12m
          script: |
            set -euo pipefail

            PROJECT_DIR=/opt/koratv/koratv-web
            APP_DIR="$PROJECT_DIR/streaming-gateway"
            REPO_URL=https://github.com/Demphil/koratv-web.git
            PLAYER_DOMAIN=fabor.sbs
            SMOKE_UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36"

            test -d "$PROJECT_DIR/.git"

            cd "$PROJECT_DIR"
            git remote set-url origin "$REPO_URL"
            git fetch --prune origin main
            git reset --hard HEAD
            git clean -fd -e streaming-gateway/.env -e secure-streaming/.env
            git checkout -B main origin/main
            git clean -fd -e streaming-gateway/.env -e secure-streaming/.env

            test -f "$APP_DIR/.env"

            cd "$APP_DIR"
            rm -rf node_modules
            npm ci --omit=dev --no-audit --fund=false
            node scripts/setup-env.js
            node --env-file=.env --input-type=module -e "import { loadConfig } from './config.js'; loadConfig(); console.log('Gateway configuration is valid')"
            npm test
            npm run check:supabase
            npm run build:player

            install -d -m 0755 /var/www/koratv-player /var/www/certbot
            cp -a dist/. /var/www/koratv-player/
            find /var/www/koratv-player -type d -exec chmod 0755 {} +
            find /var/www/koratv-player -type f -exec chmod 0644 {} +

            if [ -f "/etc/letsencrypt/live/$PLAYER_DOMAIN/fullchain.pem" ]; then
              install -m 0644 nginx.conf.example /etc/nginx/sites-available/koratv
            else
              install -m 0644 nginx.http-player.conf.example /etc/nginx/sites-available/koratv
            fi

            ln -sfn /etc/nginx/sites-available/koratv /etc/nginx/sites-enabled/koratv
            rm -f /etc/nginx/sites-enabled/fabor-bootstrap
            rm -f /etc/nginx/sites-enabled/stream-api-bootstrap
            nginx -t
            systemctl reload nginx

            resolved_ips="$(getent ahostsv4 "$PLAYER_DOMAIN" | awk '{print $1}' | sort -u | tr '\n' ' ')"
            public_ip="$(curl --fail --silent --show-error --max-time 10 https://api.ipify.org || true)"
            if [ ! -f "/etc/letsencrypt/live/$PLAYER_DOMAIN/fullchain.pem" ] && printf '%s\n' "$resolved_ips" | grep -qw "$public_ip"; then
              certbot certonly --webroot -w /var/www/certbot \
                -d fabor.sbs -d www.fabor.sbs \
                --non-interactive --agree-tos --register-unsafely-without-email
              install -m 0644 nginx.conf.example /etc/nginx/sites-available/koratv
              nginx -t
              systemctl reload nginx
            elif [ ! -f "/etc/letsencrypt/live/$PLAYER_DOMAIN/fullchain.pem" ]; then
              echo "Player DNS/TLS is not ready yet for $PLAYER_DOMAIN. Current resolved IPs: ${resolved_ips:-none}; VPS: ${public_ip:-unknown}. HTTP player bootstrap is installed."
            fi

            cd "$PROJECT_DIR"
            pm2 startOrReload ecosystem.config.js --env production
            pm2 save

            healthy=false
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --silent --show-error http://127.0.0.1:3100/healthz >/dev/null; then
                healthy=true
                break
              fi
              sleep 2
            done

            if [ "$healthy" != true ]; then
              pm2 logs koratv-gateway --lines 80 --nostream
              exit 1
            fi

            curl --fail --silent --show-error -A "$SMOKE_UA" https://stream-api.koratv.click/healthz >/dev/null
            curl --fail --silent --show-error -D /tmp/koratv-api-headers -o /dev/null \
              -A "$SMOKE_UA" \
              -H 'Origin: https://koratv.click' https://stream-api.koratv.click/api/matches
            grep -qi '^access-control-allow-origin: https://koratv.click' /tmp/koratv-api-headers

            if [ -f "/etc/letsencrypt/live/$PLAYER_DOMAIN/fullchain.pem" ]; then
              curl --fail --silent --show-error -H 'Referer: https://koratv.click/' https://fabor.sbs/739184.html >/dev/null
              test "$(curl --silent --output /dev/null --write-out '%{http_code}' https://fabor.sbs/739184.html)" = "403"
            fi
