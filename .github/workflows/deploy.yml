name: Deploy streaming gateway

on:
  workflow_dispatch:

concurrency:
  group: streaming-gateway-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Njalla VPS
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Pull, test, build, and restart streaming services
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ARRYADIA_UPSTREAM_ORIGINS: ${{ secrets.ARRYADIA_UPSTREAM_ORIGINS }}
          IPTV_PROVIDER_B_JSON: ${{ secrets.IPTV_PROVIDER_B_JSON }}
          IPTV_PROVIDER_C_JSON: ${{ secrets.IPTV_PROVIDER_C_JSON }}
          IPTV_PROVIDER_D_JSON: ${{ secrets.IPTV_PROVIDER_D_JSON }}
          IPTV_PROVIDER_E_JSON: ${{ secrets.IPTV_PROVIDER_E_JSON }}
          IPTV_PROVIDER_F_JSON: ${{ secrets.IPTV_PROVIDER_F_JSON }}
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 12m
          envs: API_FOOTBALL_KEY,ARRYADIA_UPSTREAM_ORIGINS,IPTV_PROVIDER_B_JSON,IPTV_PROVIDER_C_JSON,IPTV_PROVIDER_D_JSON,IPTV_PROVIDER_E_JSON,IPTV_PROVIDER_F_JSON
          script: |
            set -euo pipefail

            PROJECT_DIR=/opt/koratv/koratv-web
            APP_DIR="$PROJECT_DIR/streaming-gateway"
            SECURE_DIR="$PROJECT_DIR/secure-streaming"
            REPO_URL=https://github.com/Demphil/koratv-web.git
            PLAYER_DOMAIN=fabor.sbs
            SMOKE_UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36"

            test -d "$PROJECT_DIR/.git"

            cd "$PROJECT_DIR"
            git remote set-url origin "$REPO_URL"
            git fetch --prune origin main
            git reset --hard HEAD
            git clean -fd -e streaming-gateway/.env -e secure-streaming/.env
            git checkout -B main origin/main
            git clean -fd -e streaming-gateway/.env -e secure-streaming/.env

            test -f "$APP_DIR/.env"
            test -f "$SECURE_DIR/.env"

            cd "$SECURE_DIR"
            npm ci --omit=dev --no-audit --fund=false
            if [ -n "${API_FOOTBALL_KEY:-}" ]; then
              node --input-type=module -e 'import { readFile, writeFile, chmod } from "node:fs/promises"; const key = process.env.API_FOOTBALL_KEY; if (!key || /[\r\n]/.test(key)) throw new Error("Invalid API-Football credential input"); const lines = (await readFile(".env", "utf8")).split(/\r?\n/).filter(line => !/^\s*(?:export\s+)?(?:API_FOOTBALL_KEY|APIFOOTBALL_KEY|FOOTBALL_API_KEY|RAPIDAPI_KEY)\s*=/.test(line)); lines.push(`API_FOOTBALL_KEY=${key}`); await writeFile(".env", `${lines.join("\n")}\n`, { mode: 0o600 }); await chmod(".env", 0o600); console.log("API-Football credential installed without displaying its value")'
            fi
            node --env-file=.env --input-type=module -e "if (!['API_FOOTBALL_KEY','APIFOOTBALL_KEY','FOOTBALL_API_KEY','RAPIDAPI_KEY'].some((name) => process.env[name])) throw new Error('API-Football key is missing from secure-streaming/.env'); console.log('API-Football sync configuration is present')"
            npm test

            node scripts/disable-gemini-channel-suggestions.js
            MATCH_SOURCE_PROVIDER=both npm run sync:matches

            cd "$APP_DIR"
            rm -rf node_modules
            npm ci --omit=dev --no-audit --fund=false
            node scripts/setup-env.js
            if [ -n "${IPTV_PROVIDER_B_JSON:-}${IPTV_PROVIDER_C_JSON:-}" ]; then
              node --env-file=.env scripts/sync-provider-pool.js
            fi
            if [ -n "${ARRYADIA_UPSTREAM_ORIGINS:-}" ]; then
              IFS=',' read -r -a arryadia_origins <<< "$ARRYADIA_UPSTREAM_ORIGINS"
              for upstream_origin in "${arryadia_origins[@]}"; do
                node scripts/add-upstream-origin.js "$upstream_origin"
              done
            fi
            node --env-file=.env --input-type=module -e "import { loadConfig } from './config.js'; loadConfig(); console.log('Gateway configuration is valid')"
            if ! grep -q '^PROVIDER_POOL_ENABLED=true$' .env; then
              node --env-file=.env scripts/probe-arryadia-upstreams.js
            fi
            npm test
            npm run check:supabase
            npm run build:player

            install -d -m 0755 /var/www/koratv-player /var/www/certbot
            cp -a dist/. /var/www/koratv-player/
            find /var/www/koratv-player -type d -exec chmod 0755 {} +
            find /var/www/koratv-player -type f -exec chmod 0644 {} +

            if [ -f "/etc/letsencrypt/live/$PLAYER_DOMAIN/fullchain.pem" ]; then
              install -m 0644 nginx.conf.example /etc/nginx/sites-available/koratv
            else
              install -m 0644 nginx.http-player.conf.example /etc/nginx/sites-available/koratv
            fi

            ln -sfn /etc/nginx/sites-available/koratv /etc/nginx/sites-enabled/koratv
            rm -f /etc/nginx/sites-enabled/fabor-bootstrap
            rm -f /etc/nginx/sites-enabled/stream-api-bootstrap
            nginx -t
            systemctl reload nginx

            resolved_ips="$(getent ahostsv4 "$PLAYER_DOMAIN" | awk '{print $1}' | sort -u | tr '\n' ' ')"
            public_ip="$(curl --fail --silent --show-error --max-time 10 https://api.ipify.org || true)"
            if [ ! -f "/etc/letsencrypt/live/$PLAYER_DOMAIN/fullchain.pem" ] && printf '%s\n' "$resolved_ips" | grep -qw "$public_ip"; then
              certbot certonly --webroot -w /var/www/certbot \
                -d fabor.sbs -d www.fabor.sbs \
                --non-interactive --agree-tos --register-unsafely-without-email
              install -m 0644 nginx.conf.example /etc/nginx/sites-available/koratv
              nginx -t
              systemctl reload nginx
            elif [ ! -f "/etc/letsencrypt/live/$PLAYER_DOMAIN/fullchain.pem" ]; then
              echo "Player DNS/TLS is not ready yet for $PLAYER_DOMAIN. Current resolved IPs: ${resolved_ips:-none}; VPS: ${public_ip:-unknown}. HTTP player bootstrap is installed."
            fi

            cd "$PROJECT_DIR"
            pm2 startOrReload ecosystem.config.js --env production
            pm2 save

            healthy=false
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --silent --show-error http://127.0.0.1:3100/healthz >/dev/null; then
                healthy=true
                break
              fi
              sleep 2
            done

            if [ "$healthy" != true ]; then
              pm2 logs koratv-gateway --lines 80 --nostream
              exit 1
            fi

            curl --fail --silent --show-error -A "$SMOKE_UA" https://stream-api.koratv.click/healthz >/dev/null || echo "External health smoke skipped by edge protection"
            curl --fail --silent --show-error -D /tmp/koratv-api-headers -o /dev/null \
              -A "$SMOKE_UA" \
              -H 'Origin: https://koratv.click' https://stream-api.koratv.click/api/matches \
              && grep -qi '^access-control-allow-origin: https://koratv.click' /tmp/koratv-api-headers \
              || echo "External matches smoke skipped by edge protection"

            if [ -f "/etc/letsencrypt/live/$PLAYER_DOMAIN/fullchain.pem" ]; then
              curl --fail --silent --show-error -H 'Referer: https://koratv.click/' https://fabor.sbs/739184.html >/dev/null || echo "External player smoke skipped by edge protection"
            fi
