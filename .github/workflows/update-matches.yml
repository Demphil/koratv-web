name: Update Matches Data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update-matches:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_ENRICH_AFTER_MATCH_SYNC: "false"
      SUPABASE_MATCHES_TABLE: matches
      IPTV_PROVIDER_HOST: ${{ secrets.IPTV_PROVIDER_HOST }}
      IPTV_PROVIDER_BACKUP_HOST: ${{ secrets.IPTV_PROVIDER_BACKUP_HOST }}
      IPTV_PROVIDER_USERNAME: ${{ secrets.IPTV_PROVIDER_USERNAME }}
      IPTV_PROVIDER_PASSWORD: ${{ secrets.IPTV_PROVIDER_PASSWORD }}
      IPTV_PROVIDER_TYPE: ${{ secrets.IPTV_PROVIDER_TYPE }}
      IPTV_PROVIDER_OUTPUT: ${{ secrets.IPTV_PROVIDER_OUTPUT }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: secure-streaming/package-lock.json

      - name: Install secure streaming dependencies
        working-directory: secure-streaming
        run: npm ci

      - name: Sync matches and enrich broadcasters
        working-directory: secure-streaming
        run: npm run sync:matches

      - name: Sync IPTV provider links
        if: github.event_name == 'workflow_dispatch'
        working-directory: secure-streaming
        run: npm run sync:iptv
