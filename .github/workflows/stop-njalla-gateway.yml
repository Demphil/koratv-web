name: Stop IPTV gateway on Njalla

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stop-gateway:
    name: Keep Njalla on static player only
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Stop and remove the gateway from PM2 startup
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 2m
          script: |
            set -euo pipefail
            pm2 delete koratv-gateway || true
            pm2 save
            if pm2 describe koratv-gateway >/dev/null 2>&1; then
              echo "Gateway process is still registered; refusing to report success"
              exit 1
            fi
            echo "Gateway stopped; static Nginx player files were left untouched"
