          <div class="match-panel-score">

          <div class="match-panel-team">
            <img id="match-away-logo" alt="" loading="lazy">
            <span id="match-away-name"></span>
          </div>
        </div>
        <div class="match-panel-stats">
          <span><i class="card-dot yellow"></i><b id="match-yellow-cards">0</b> صفراء</span>
          <span><i class="card-dot red"></i><b id="match-red-cards">0</b> حمراء</span>

      <section class="watch-news-section">
