<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>مشاهدة المباراة بث مباشر | KoraTV</title>
  <meta name="robots" content="noindex, follow">
  <meta name="monetag" content="1b10ab3c35e3426936bb8124f9159790">
  <script src="./embed-mode.js"></script>
  <link rel="stylesheet" href="./plyr.css">
  <link rel="stylesheet" href="./player.css">
</head>
<body>
  <div class="layout-wrapper">
    <main class="main-content">
      <header class="player-heading"><img class="morocco-flag" src="./flag-morocco.png" width="24" height="16" alt="المغرب"><strong dir="ltr">KORA TV</strong><span class="heading-live">مباشر</span></header>
      <section id="player-container" class="player-container" aria-live="polite">
        <video id="video" controls playsinline controlslist="nodownload noplaybackrate"></video>
        <button id="embed-button" class="embed-button player-tool-button" type="button" aria-label="كود التضمين">&lt;/&gt;</button>
        <button id="refresh-stream" class="refresh-stream player-tool-button" type="button" aria-label="تحديث البث">⟳</button>
        <div id="video-picture-overlay" class="video-picture-overlay" data-integrity-protected="true" aria-hidden="true">
          <div class="picture-brand"><strong>KORA<span>TV</span></strong><small>KORATV.CLICK</small></div>
          <div class="picture-app-promo"><span class="app-icon">K<span>TV</span></span><span>تطبيق KoraTV <b>قريباً</b></span></div>
        </div>
        <div id="status" class="player-state" role="status">جاري تحميل البث...</div>
      </section>
      <dialog id="embed-modal" class="embed-modal" aria-labelledby="embed-modal-title" hidden>
        <div class="embed-modal-backdrop" data-close-embed></div>
        <section class="embed-modal-card" role="dialog" aria-modal="true" aria-labelledby="embed-modal-title">
          <button class="embed-modal-close" type="button" data-close-embed aria-label="إغلاق">×</button>
          <h3 id="embed-modal-title">كود التضمين</h3>
          <textarea id="embed-code" readonly spellcheck="false"></textarea>
          <button id="copy-embed-code" class="copy-embed-code" type="button">نسخ الكود</button>
          <p class="embed-terms">يُسمح بالتضمين مع إبقاء الشعار والإعلانات، دون قصّ المشغل أو تغطيته أو تعديل محتواه.</p>
        </section>
      </dialog>

      <section id="match-panel" class="match-panel" hidden>
        <div class="match-panel-header">
          <span id="match-state-pill" class="match-state-pill">مباشر</span>
          <div class="match-panel-meta"><strong id="match-league"></strong><span id="match-channel-name"></span></div>
        </div>
        <div class="match-panel-teams">
          <div class="match-panel-team">
            <img id="match-home-logo" alt="" loading="lazy">
            <span id="match-home-name"></span>
            <small id="match-home-name-ar" lang="ar" dir="rtl" hidden></small>
          </div>
          <div class="match-panel-score">
            <strong id="match-score">VS</strong>
            <span id="match-minute"></span>
          </div>
          <div class="match-panel-team">
            <img id="match-away-logo" alt="" loading="lazy">
            <span id="match-away-name"></span>
            <small id="match-away-name-ar" lang="ar" dir="rtl" hidden></small>
          </div>
        </div>
        <div class="match-panel-stats">
          <span><i class="card-dot yellow"></i><b id="match-yellow-cards">0</b> صفراء</span>
          <span><i class="card-dot red"></i><b id="match-red-cards">0</b> حمراء</span>
        </div>
        <div id="match-api-map" class="match-api-map" role="tablist" aria-label="معلومات المباراة">
          <button class="match-api-node is-selected" type="button" role="tab" aria-selected="true" data-endpoint="details">التفاصيل</button>
          <button class="match-api-node" type="button" role="tab" aria-selected="false" data-endpoint="lineups">التشكيلة</button>
          <button class="match-api-node" type="button" role="tab" aria-selected="false" data-endpoint="standings">الترتيب</button>
        </div>
        <div id="match-api-detail" class="match-api-detail" aria-live="polite"></div>
        <div id="match-goals" class="match-goals"></div>
      </section>

      <section class="watch-news-section">
        <h3 class="watch-news-title">أحدث الأخبار الرياضية</h3>
        <div id="watch-news-container" class="watch-news-grid"></div>
      </section>
    </main>
  </div>

  <script src="./config.js"></script>
  <script src="./hls.min.js"></script>
  <script src="./plyr.js"></script>
  <script src="./player.js"></script>
  <script src="./player-branding.js"></script>
  <script>
    (() => {
      const AD_START_DELAY_MS = 2 * 60 * 1000;
      const AD_COOLDOWN_MS = 5 * 60 * 1000;
      const AD_ACTIVE_WINDOW_MS = 45 * 1000;
      const DIRECT_CLICK_URL = 'https://omg10.com/4/11908572';
      const MONETAG_SCRIPTS = [
        { zone: '11908579', src: 'https://nap5k.com/tag.min.js' },
        { zone: '11908582', src: 'https://n6wxm.com/vignette.min.js' }
      ];
      const container = document.getElementById('player-container');
      const video = document.getElementById('video');
      let clickShield = null;

      function removeMonetagScripts() {
        document.querySelectorAll('script[data-koratv-monetag="true"]').forEach((script) => script.remove());
      }

      function injectMonetagScripts() {
        removeMonetagScripts();
        for (const item of MONETAG_SCRIPTS) {
          const script = document.createElement('script');
          script.dataset.koratvMonetag = 'true';
          script.dataset.zone = item.zone;
          script.dataset.cfasync = 'false';
          script.async = true;
          script.src = `${item.src}?kt=${Date.now()}`;
          document.body.appendChild(script);
        }
      }

      function runMonetagCycle() {
        injectMonetagScripts();
        window.setTimeout(removeMonetagScripts, AD_ACTIVE_WINDOW_MS);
        window.setTimeout(runMonetagCycle, AD_COOLDOWN_MS);
      }

      function armClickAd() {
        if (clickShield || !container) return;
        const shield = document.createElement('button');
        shield.type = 'button';
        shield.className = 'ad-click-shield';
        shield.setAttribute('aria-label', 'تشغيل الفيديو');
        shield.addEventListener('click', (event) => {
          event.preventDefault();
          event.stopPropagation();
          clickShield = null;
          shield.remove();
          try { window.open(DIRECT_CLICK_URL, '_blank', 'noopener,noreferrer'); } catch {}
          video?.play?.().catch(() => {});
          window.setTimeout(armClickAd, AD_COOLDOWN_MS);
        }, { once: true });
        clickShield = shield;
        container.appendChild(shield);
      }

      window.setTimeout(runMonetagCycle, AD_START_DELAY_MS);
      window.setTimeout(armClickAd, AD_START_DELAY_MS);
    })();
  </script>
</body>
</html>
