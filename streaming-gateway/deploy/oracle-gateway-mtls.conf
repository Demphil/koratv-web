# Dedicated authenticated edge connection; the KoraScore vhost is unchanged.
server {
    listen 443 ssl;
    server_name oracle-gateway.internal;
    ssl_certificate /etc/koratv/oracle-link/server.crt;
    ssl_certificate_key /etc/koratv/oracle-link/server.key;
    ssl_client_certificate /etc/koratv/oracle-link/ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;
    ssl_protocols TLSv1.2 TLSv1.3;
    allow 80.78.30.212;
    deny all;
    access_log off;
    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
